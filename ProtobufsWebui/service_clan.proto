import "common_base.proto";

message CClan_GetAdjacentPartnerEvents_Request {
	optional fixed64 steamid = 1;
	optional fixed64 clan_event_gid = 2;
	optional fixed64 clan_announcement_gid = 3;
	optional uint32 count_earlier = 4 [default = 1];
	optional uint32 count_later = 5 [default = 1];
	repeated string required_tags = 6;
	optional bool require_no_tags = 7;
	repeated uint32 language_preference = 8;
	optional uint32 rtime_oldest_date = 9;
	optional bool include_old_announcements = 10 [default = true];
	optional bool include_old_events = 11 [default = false];
	repeated string exclude_tags = 12;
	repeated int32 event_type_filter = 13 [(.description) = "enum"];
	repeated int32 exclude_event_types = 14 [(.description) = "enum"];
	optional bool only_summaries = 15;
}

message CClan_GetAdjacentPartnerEvents_Response {
	repeated .CClanEventData event_data = 1;
	optional bool more_before = 2;
	optional bool more_after = 3;
	optional bool clan_is_creator_home = 4;
	optional bool clan_is_ogg = 5;
	optional bool clan_is_ovg = 6;
}

message CClan_GetDraftAndRecentPartnerEventSnippet_Request {
	optional fixed64 steamid = 1;
	optional uint32 rtime_oldest_date = 2;
}

message CClan_GetDraftAndRecentPartnerEventSnippet_Response {
	repeated .CClan_GetDraftAndRecentPartnerEventSnippet_Response_CEventSnippetData snippets = 1;
}

message CClan_GetDraftAndRecentPartnerEventSnippet_Response_CEventSnippetData {
	optional fixed64 gid = 1;
	optional fixed64 announcement_gid = 2;
	optional bool hidden = 3;
	optional bool published = 4;
	optional uint32 rtime32_start_time = 5;
	optional string event_name = 6;
	optional int32 event_type = 7 [(.description) = "enum"];
}

message CClan_GetPartnerEventsByBuildIDRange_Request {
	repeated .CClan_GetPartnerEventsByBuildIDRange_Request_PatchNoteRange requests = 1;
	optional string cursor = 2;
	optional uint32 count = 3 [default = 100];
}

message CClan_GetPartnerEventsByBuildIDRange_Request_PatchNoteRange {
	optional uint32 appid = 1;
	optional uint32 start_build_id = 2;
	optional uint32 end_build_id = 3;
	optional string branch = 4;
}

message CClan_GetPartnerEventsByBuildIDRange_Response {
	repeated .CClan_GetPartnerEventsByBuildIDRange_Response_PatchNotesDesc matches = 1;
	optional uint32 num_total_results = 2;
	optional string next_cursor = 3;
}

message CClan_GetPartnerEventsByBuildIDRange_Response_PatchNotesDesc {
	optional uint32 appid = 1;
	optional uint32 build_id = 2;
	optional string branch = 3;
	optional fixed64 clan_event_gid = 4;
	optional uint32 clan_account_id = 5;
}

message CClan_GetPartnerEventSummaries_Request {
	optional fixed64 steamid = 1;
	repeated .CClan_GetPartnerEventSummaries_Request_Event events = 2;
	optional uint32 language = 3;
}

message CClan_GetPartnerEventSummaries_Request_Event {
	optional uint32 clan_accountid = 1;
	optional fixed64 clan_event_gid = 2;
	optional fixed64 announcement_gid = 3;
}

message CClan_GetPartnerEventSummaries_Response {
	repeated .CPartnerEventSummary summaries = 1;
}

message CClan_RespondToClanInvite_Request {
	optional fixed64 steamid = 1;
	optional bool accept = 2;
}

message CClan_RespondToClanInvite_Response {
}

message CClanEventData {
	optional fixed64 gid = 1;
	optional fixed64 clan_steamid = 2;
	optional string event_name = 3;
	optional int32 event_type = 4 [(.description) = "enum"];
	optional uint32 appid = 5;
	optional string server_address = 6;
	optional string server_password = 7;
	optional uint32 rtime32_start_time = 8;
	optional uint32 rtime32_end_time = 9;
	optional int32 comment_count = 10;
	optional fixed64 creator_steamid = 11;
	optional fixed64 last_update_steamid = 12;
	optional string event_notes = 13;
	optional string jsondata = 14;
	optional .CCommunity_ClanAnnouncementInfo announcement_body = 15;
	optional bool published = 16;
	optional bool hidden = 17;
	optional uint32 rtime32_visibility_start = 18;
	optional uint32 rtime32_visibility_end = 19;
	optional uint32 broadcaster_accountid = 20;
	optional uint32 follower_count = 21;
	optional uint32 ignore_count = 22;
	optional fixed64 forum_topic_id = 23;
	optional uint32 rtime32_last_modified = 24;
	optional fixed64 news_post_gid = 25;
	optional uint32 rtime_mod_reviewed = 26;
	optional uint32 featured_app_tagid = 27;
	repeated uint32 referenced_appids = 28;
	optional uint32 build_id = 29;
	optional string build_branch = 30;
	optional bool unlisted = 31;
	optional uint32 rtime_created = 32;
}

message CCommunity_ClanAnnouncementInfo {
	optional uint64 gid = 1;
	optional uint64 clanid = 2;
	optional uint64 posterid = 3;
	optional string headline = 4;
	optional uint32 posttime = 5;
	optional uint32 updatetime = 6;
	optional string body = 7;
	optional int32 commentcount = 8;
	repeated string tags = 9;
	optional int32 language = 10;
	optional bool hidden = 11;
	optional fixed64 forum_topic_id = 12;
	optional fixed64 event_gid = 13;
	optional int32 voteupcount = 14;
	optional int32 votedowncount = 15;
	optional int32 ban_check_result = 16 [(.description) = "enum"];
	optional bool banned = 17;
}

message CPartnerEventSummary {
	optional uint32 clan_accountid = 1;
	optional fixed64 clan_event_gid = 2;
	optional fixed64 announcement_gid = 3;
	optional uint32 appid = 4;
	optional int32 event_type = 5 [(.description) = "enum"];
	repeated string tags = 6;
	optional uint32 rtime32_start_time = 7;
	optional uint32 rtime32_end_time = 8;
	optional uint32 rtime32_visibility_start = 9;
	optional uint32 rtime32_visibility_end = 10;
	optional string event_name = 11;
	optional string subtitle = 12;
	optional string summary = 13;
	optional .CPartnerEventSummary_Image capsule_image = 14;
	optional string store_path = 15;
	optional uint32 rtime32_post_time = 20;
	optional .CPartnerEventSummary_CrossPromo cross_promo = 21;
	optional bool adult_only_content = 22;
}

message CPartnerEventSummary_CrossPromo {
	optional string background_image = 1;
	optional string scrim_color = 2;
	optional string desktop_layout = 3;
	optional .CPartnerEventSummary_Image logo = 4;
}

message CPartnerEventSummary_Image {
	optional string image = 1;
	optional uint32 language = 2;
	optional bool from_body = 3;
}

service Clan {
	// bConstMethod=true, ePrivilege=2, eWebAPIKeyRequirement=1, rgBrowserAPISites=ArrayExpression
	rpc GetAdjacentPartnerEvents (.CClan_GetAdjacentPartnerEvents_Request) returns (.CClan_GetAdjacentPartnerEvents_Response);
	// bConstMethod=true, ePrivilege=1
	rpc GetDraftAndRecentPartnerEventSnippet (.CClan_GetDraftAndRecentPartnerEventSnippet_Request) returns (.CClan_GetDraftAndRecentPartnerEventSnippet_Response);
	// bConstMethod=true, ePrivilege=1, eWebAPIKeyRequirement=1, rgBrowserAPISites=ArrayExpression
	rpc GetPartnerEventsByBuildIDRange (.CClan_GetPartnerEventsByBuildIDRange_Request) returns (.CClan_GetPartnerEventsByBuildIDRange_Response);
	// ePrivilege=2, rgBrowserAPISites=ArrayExpression
	rpc GetPartnerEventSummaries (.CClan_GetPartnerEventSummaries_Request) returns (.CClan_GetPartnerEventSummaries_Response);
	// ePrivilege=1
	rpc RespondToClanInvite (.CClan_RespondToClanInvite_Request) returns (.CClan_RespondToClanInvite_Response);
}

