import "common_base.proto";

message AdditionalSubjectData {
	repeated .AdditionalSubjectData_DataEntry data = 1;
}

message AdditionalSubjectData_DataEntry {
	optional string key = 1;
	optional string value = 2;
}

message CContentModeration_ClaimBatch_Request {
	optional int32 subject_type = 1 [(.description) = "enum"];
	optional int32 moderator_level = 2 [(.description) = "enum"];
	repeated .ReportedContentCoordinates filters = 3;
}

message CContentModeration_ClaimBatch_Response {
	repeated .ContentReportSubject subjects = 1;
}

message CContentModeration_EscalateSubjectByID_Request {
	optional uint64 reported_content_id = 1;
	optional int32 new_level = 2 [(.description) = "enum"];
	optional int32 reason = 3 [(.description) = "enum"];
	optional string note = 4;
}

message CContentModeration_EscalateSubjectByID_Response {
}

message CContentModeration_GetAuditLogByID_Request {
	optional uint64 reported_content_id = 1;
}

message CContentModeration_GetAuditLogByID_Response {
	repeated .CContentModeration_GetAuditLogByID_Response_AuditLogEntry entries = 1;
}

message CContentModeration_GetAuditLogByID_Response_AuditLogEntry {
	optional uint32 timestamp = 1;
	optional fixed64 actor_steamid = 2;
	optional bool automated_action = 3;
	optional int32 action = 4 [(.description) = "enum"];
	optional string additional_json_data = 5;
	optional bool actor_is_support = 6;
}

message CContentModeration_GetClaimedSubjects_Request {
	optional uint64 steamid = 1;
}

message CContentModeration_GetClaimedSubjects_Response {
	repeated .ContentReportSubject subjects = 1;
}

message CContentModeration_GetDailyModerationStatistics_Request {
	optional uint32 rtime_start_date = 1;
	optional uint32 rtime_end_date = 2;
	optional int32 subject_type = 3 [(.description) = "enum"];
}

message CContentModeration_GetDailyModerationStatistics_Response {
	repeated .CContentModeration_GetDailyModerationStatistics_Response_DayStatistics stats = 2;
}

message CContentModeration_GetDailyModerationStatistics_Response_DayStatistics {
	optional uint32 rtime_date = 1;
	optional uint32 times_unresolved = 2;
	optional uint32 times_resolved = 3;
}

message CContentModeration_GetModeratorActivity_Request {
	optional fixed64 steamid = 1;
	optional uint32 rt_start = 2;
}

message CContentModeration_GetModeratorActivity_Response {
	repeated .CContentModeration_GetModeratorActivity_Response_ModerationActivity activities = 1;
}

message CContentModeration_GetModeratorActivity_Response_ModerationActivity {
	optional int32 subject_type = 1 [(.description) = "enum"];
	optional uint64 subject_group_id = 2;
	optional uint64 subject_id = 3;
	optional uint32 timestamp = 4;
	optional int32 action = 5 [(.description) = "enum"];
	optional string json_data = 6;
	optional uint64 reported_content_id = 7;
}

message CContentModeration_GetModeratorPreferences_Request {
	optional fixed64 steamid = 1;
}

message CContentModeration_GetModeratorPreferences_Response {
	optional int32 preferred_level = 1 [(.description) = "enum"];
	repeated int32 enabled_subject_types = 2 [(.description) = "enum"];
}

message CContentModeration_GetOldestUnresolvedSubjects_Request {
	optional int32 subject_type = 1 [(.description) = "enum"];
	optional uint32 count = 2;
}

message CContentModeration_GetOldestUnresolvedSubjects_Response {
	repeated .CContentModeration_GetOldestUnresolvedSubjects_Response_Subject subjects = 1;
}

message CContentModeration_GetOldestUnresolvedSubjects_Response_Subject {
	optional int32 subject_type = 1 [(.description) = "enum"];
	optional uint64 subject_group_id = 2;
	optional uint64 subject_id = 3;
	optional uint64 reported_content_id = 4;
}

message CContentModeration_GetOneReportSubmittedByUser_Request {
	optional uint64 steamid = 1;
	optional int32 subject_type = 2 [(.description) = "enum"];
	optional uint64 subject_group_id = 3;
	optional uint64 subject_id = 4;
	optional uint64 reported_content_id = 5;
}

message CContentModeration_GetOneReportSubmittedByUser_Response {
	optional .ContentReport content_report = 1;
}

message CContentModeration_GetReportedContent_Request {
	optional .ReportedContentCoordinates coordinates = 1;
}

message CContentModeration_GetReportedContent_Response {
	repeated .ContentReportSubject subjects = 1;
}

message CContentModeration_GetReportedContentByID_Request {
	optional uint64 reported_content_id = 1;
	optional bool include_reporter_account_status = 2;
}

message CContentModeration_GetReportedContentByID_Response {
	optional .ContentReportSubject subject = 1;
}

message CContentModeration_GetReportedSubjectsByOwner_Request {
	optional uint64 steamid = 1;
}

message CContentModeration_GetReportedSubjectsByOwner_Response {
	repeated .ContentReportSubject subject = 1;
}

message CContentModeration_GetReporterCooldown_Request {
	optional fixed64 steamid = 1;
}

message CContentModeration_GetReporterCooldown_Response {
	optional uint32 rtime_cooldown_ends = 1;
}

message CContentModeration_GetReporterStats_Request {
	optional uint64 steamid = 1;
}

message CContentModeration_GetReporterStats_Response {
	optional uint32 total_reports = 1;
	optional uint32 total_acquitted_reports = 2;
	optional uint32 reports_in_last_week = 3;
	optional uint32 acquitted_reports_in_last_week = 4;
}

message CContentModeration_GetReportsSubmittedByUser_Request {
	optional uint64 steamid = 1;
	optional uint32 start = 2;
	optional uint32 count = 3;
}

message CContentModeration_GetReportsSubmittedByUser_Response {
	repeated .ContentReport content_report = 1;
	optional uint32 total_count = 2;
}

message CContentModeration_GetSubjectOverview_Request {
}

message CContentModeration_GetSubjectOverview_Response {
	repeated .CContentModeration_GetSubjectOverview_Response_Bucket buckets = 1;
	optional uint32 pending_for_any_moderator = 2;
	optional uint32 pending_for_supervisor = 3;
	optional uint32 pending_for_valve = 4;
}

message CContentModeration_GetSubjectOverview_Response_Bucket {
	optional int32 subject_type = 1 [(.description) = "enum"];
	optional uint32 unresolved_count = 2;
	optional uint32 oldest_unresolved = 3;
	optional uint32 unclaimed_count = 4;
	optional uint32 oldest_disputed = 5;
	optional uint32 disputed_count = 6;
	optional uint32 unclaimed_disputed_count = 7;
	optional uint32 pending_for_any_moderator = 8;
	optional uint32 pending_for_supervisor = 9;
	optional uint32 pending_for_valve = 10;
	optional uint32 oldest_unresolved_for_any_moderator = 11;
	optional uint32 oldest_unresolved_for_supervisor = 12;
	optional uint32 oldest_unresolved_for_valve = 13;
	optional .ReportedContentCoordinates coordinates = 14;
	optional uint32 claimable_for_any_moderator = 15;
	optional uint32 claimable_for_supervisor = 16;
	optional uint32 claimable_for_valve = 17;
}

message CContentModeration_OwnerDisputeModeration_Request {
	optional uint64 reported_content_id = 1;
	optional string details = 2;
}

message CContentModeration_OwnerDisputeModeration_Response {
}

message CContentModeration_ReleaseSubjects_Request {
	repeated .ContentReportSubjectKey subjects_to_release = 1;
}

message CContentModeration_ReleaseSubjects_Response {
}

message CContentModeration_ReporterDisputeModeration_Request {
	optional uint64 reported_content_id = 1;
	optional uint64 report_id = 2;
	optional string dispute_details = 3;
}

message CContentModeration_ReporterDisputeModeration_Response {
}

message CContentModeration_ResolveByID_Request {
	optional uint64 reported_content_id = 1;
	optional int32 reason = 2 [(.description) = "enum"];
	optional string note = 3;
	optional int32 resolution = 4 [(.description) = "enum"];
	optional int32 resolved_by_automation = 7 [(.description) = "enum"];
	repeated .ContentReportSubjectSanction sanctions_applied = 9;
	optional bool skip_lock = 10;
}

message CContentModeration_ResolveByID_Response {
}

message CContentModeration_SetModeratorPreferences_Request {
	optional int32 preferred_level = 1 [(.description) = "enum"];
	optional .CContentModeration_SetModeratorPreferences_Request_SubjectTypeList enabled_subject_types = 2;
}

message CContentModeration_SetModeratorPreferences_Request_SubjectTypeList {
	repeated int32 subject_types = 1 [(.description) = "enum"];
}

message CContentModeration_SetModeratorPreferences_Response {
}

message CContentModeration_SustainModerationByID_Request {
	optional uint64 reported_content_id = 1;
}

message CContentModeration_SustainModerationByID_Response {
}

message CContentModeration_UpdateReporterCooldown_Request {
	optional fixed64 steamid = 1;
	optional uint32 rtime_cooldown_ends = 2;
	optional bool acquit_unresolved_reports = 3;
}

message CContentModeration_UpdateReporterCooldown_Response {
}

message CContentModeration_UpdateSubjectByID_Request {
	optional uint64 reported_content_id = 1;
	optional int32 csam_status = 2 [(.description) = "enum"];
	optional int32 terrorism_status = 3 [(.description) = "enum"];
	optional int32 credible_threat_of_violence_status = 4 [(.description) = "enum"];
	optional .AdditionalSubjectData additional_subject_data = 5;
	optional string owner_dispute_details = 6;
}

message CContentModeration_UpdateSubjectByID_Response {
}

message CContentModeration_WriteToAuditLogByID_Request {
	optional uint64 reported_content_id = 1;
	optional int32 action = 2 [(.description) = "enum"];
	optional bool automated_action = 3;
	optional string additional_json_data = 4;
	optional fixed64 actor_steamid = 5;
}

message CContentModeration_WriteToAuditLogByID_Response {
}

message ContentReport {
	optional uint64 report_id = 1;
	optional uint64 reporter_steamid = 2;
	optional uint32 time_reported = 3;
	optional int32 report_reason = 4 [(.description) = "enum"];
	optional string report_text = 5;
	optional int32 subject_type = 6 [(.description) = "enum"];
	optional uint64 subject_group_id = 7;
	optional uint64 subject_id = 8;
	optional int32 resolved = 9 [(.description) = "enum"];
	optional uint32 time_resolved = 10;
	optional uint64 resolver_steamid = 11;
	optional uint32 time_notified = 12;
	optional .AdditionalSubjectData additional_subject_data = 13;
	optional uint32 time_disputed = 14;
	optional string dispute_details = 15;
	optional uint64 dispute_resolver_steamid = 16;
	optional int32 dispute_resolved = 17 [(.description) = "enum"];
	optional uint32 time_dispute_resolved = 18;
	optional bool detected_by_automation = 19 [default = false];
	optional int32 resolved_by_automation = 20 [default = 0, (.description) = "enum"];
	optional int32 content_moderated_reason = 21 [(.description) = "enum"];
	optional int32 dispute_resolved_reason = 22 [(.description) = "enum"];
	repeated .ContentReportSubjectSanction sanctions_applied = 23;
	repeated .ContentReportSubjectSanction sanctions_applied_on_dispute = 24;
	optional uint64 reported_content_id = 25;
	optional .ReportedContentCoordinates coordinates = 26;
	optional bool reporter_is_support = 27;
}

message ContentReportSubject {
	optional int32 subject_type = 1 [(.description) = "enum"];
	optional uint64 subject_group_id = 2;
	optional uint64 subject_id = 3;
	optional uint64 owner_steam_id = 4;
	optional int32 language = 5;
	optional int32 resolved = 6 [(.description) = "enum"];
	optional uint32 time_resolved = 7;
	optional uint32 unresolved_report_count = 8;
	optional uint32 oldest_unresolved_report_time = 9;
	optional uint64 resolver_steamid = 10;
	optional uint64 assigned_moderator_steamid = 11;
	optional uint64 time_claimed_by_moderator = 12;
	repeated .ContentReport reports = 13;
	optional .AdditionalSubjectData additional_subject_data = 14;
	optional int32 csam_status = 15 [(.description) = "enum"];
	optional int32 terrorism_status = 16 [(.description) = "enum"];
	optional int32 content_moderated_reason = 17 [(.description) = "enum"];
	optional uint32 unresolved_dispute_count = 18;
	optional uint32 oldest_unresolved_dispute_time = 19;
	optional uint32 owner_dispute_time = 24;
	optional uint32 owner_dispute_resolved_time = 25;
	optional string owner_dispute_details = 26;
	optional int32 required_moderator_level = 27 [(.description) = "enum"];
	optional int32 resolved_by_automation = 28 [default = 0, (.description) = "enum"];
	optional bool detected_by_automation = 29 [default = false];
	optional int32 credible_threat_of_violence_status = 30 [(.description) = "enum"];
	repeated .ContentReportSubjectSanction sanctions_applied = 31;
	repeated .ContentReportSubjectSanction sanctions_applied_after_dispute = 32;
	optional bool decision_reversed = 33;
	optional uint64 reported_content_id = 34;
	optional .ReportedContentCoordinates coordinates = 35;
}

message ContentReportSubjectKey {
	optional int32 subject_type = 1 [(.description) = "enum"];
	optional uint64 subject_group_id = 2;
	optional uint64 subject_id = 3;
	optional uint64 reported_content_id = 4;
}

message ContentReportSubjectSanction {
	optional int32 sanction = 1 [(.description) = "enum"];
	optional int32 days = 2;
	optional int32 escalate_to = 3 [(.description) = "enum"];
}

message ReportedContentCoordinates {
	optional int32 subject_type = 1 [(.description) = "enum"];
	optional uint64 steamid = 2;
	optional uint64 forum = 3;
	optional uint64 topic = 4;
	optional uint64 comment = 5;
	optional uint64 comment_thread_id = 6;
	optional uint32 sender_account_id = 7;
	optional uint32 chat_message_rtime = 8;
	optional uint32 chat_message_ordinal = 9;
	optional uint64 chat_group_id = 10;
	optional uint64 chat_room_id = 11;
	optional uint32 receiver_account_id = 12;
	optional uint64 published_file_id = 13;
	optional uint32 ugc_content_type = 14;
}

service ContentModeration {
	// ePrivilege=5
	rpc ClaimBatch (.CContentModeration_ClaimBatch_Request) returns (.CContentModeration_ClaimBatch_Response);
	// ePrivilege=5
	rpc EscalateSubjectByID (.CContentModeration_EscalateSubjectByID_Request) returns (.CContentModeration_EscalateSubjectByID_Response);
	// bConstMethod=true, ePrivilege=5
	rpc GetAuditLogByID (.CContentModeration_GetAuditLogByID_Request) returns (.CContentModeration_GetAuditLogByID_Response);
	// bConstMethod=true, ePrivilege=5
	rpc GetClaimedSubjects (.CContentModeration_GetClaimedSubjects_Request) returns (.CContentModeration_GetClaimedSubjects_Response);
	// bConstMethod=true, ePrivilege=5
	rpc GetDailyModerationStatistics (.CContentModeration_GetDailyModerationStatistics_Request) returns (.CContentModeration_GetDailyModerationStatistics_Response);
	// ePrivilege=5
	rpc GetModeratorActivity (.CContentModeration_GetModeratorActivity_Request) returns (.CContentModeration_GetModeratorActivity_Response);
	// bConstMethod=true, ePrivilege=5
	rpc GetModeratorPreferences (.CContentModeration_GetModeratorPreferences_Request) returns (.CContentModeration_GetModeratorPreferences_Response);
	// bConstMethod=true, ePrivilege=5
	rpc GetOldestUnresolvedSubjects (.CContentModeration_GetOldestUnresolvedSubjects_Request) returns (.CContentModeration_GetOldestUnresolvedSubjects_Response);
	// bConstMethod=true, ePrivilege=1
	rpc GetOneReportSubmittedByUser (.CContentModeration_GetOneReportSubmittedByUser_Request) returns (.CContentModeration_GetOneReportSubmittedByUser_Response);
	// bConstMethod=true, ePrivilege=5
	rpc GetReportedContent (.CContentModeration_GetReportedContent_Request) returns (.CContentModeration_GetReportedContent_Response);
	// bConstMethod=true, ePrivilege=1
	rpc GetReportedContentByID (.CContentModeration_GetReportedContentByID_Request) returns (.CContentModeration_GetReportedContentByID_Response);
	// bConstMethod=true, ePrivilege=5
	rpc GetReportedSubjectsByOwner (.CContentModeration_GetReportedSubjectsByOwner_Request) returns (.CContentModeration_GetReportedSubjectsByOwner_Response);
	// bConstMethod=true, ePrivilege=1
	rpc GetReporterCooldown (.CContentModeration_GetReporterCooldown_Request) returns (.CContentModeration_GetReporterCooldown_Response);
	// bConstMethod=true, ePrivilege=5
	rpc GetReporterStats (.CContentModeration_GetReporterStats_Request) returns (.CContentModeration_GetReporterStats_Response);
	// bConstMethod=true, ePrivilege=1
	rpc GetReportsSubmittedByUser (.CContentModeration_GetReportsSubmittedByUser_Request) returns (.CContentModeration_GetReportsSubmittedByUser_Response);
	// ePrivilege=5
	rpc GetSubjectOverview (.CContentModeration_GetSubjectOverview_Request) returns (.CContentModeration_GetSubjectOverview_Response);
	// ePrivilege=1
	rpc OwnerDisputeModeration (.CContentModeration_OwnerDisputeModeration_Request) returns (.CContentModeration_OwnerDisputeModeration_Response);
	// ePrivilege=5
	rpc ReleaseSubjects (.CContentModeration_ReleaseSubjects_Request) returns (.CContentModeration_ReleaseSubjects_Response);
	// ePrivilege=1
	rpc ReporterDisputeModeration (.CContentModeration_ReporterDisputeModeration_Request) returns (.CContentModeration_ReporterDisputeModeration_Response);
	// ePrivilege=5
	rpc ResolveByID (.CContentModeration_ResolveByID_Request) returns (.CContentModeration_ResolveByID_Response);
	// ePrivilege=5
	rpc SetModeratorPreferences (.CContentModeration_SetModeratorPreferences_Request) returns (.CContentModeration_SetModeratorPreferences_Response);
	// ePrivilege=5
	rpc SustainModerationByID (.CContentModeration_SustainModerationByID_Request) returns (.CContentModeration_SustainModerationByID_Response);
	// ePrivilege=5
	rpc UpdateReporterCooldown (.CContentModeration_UpdateReporterCooldown_Request) returns (.CContentModeration_UpdateReporterCooldown_Response);
	// ePrivilege=5
	rpc UpdateSubjectByID (.CContentModeration_UpdateSubjectByID_Request) returns (.CContentModeration_UpdateSubjectByID_Response);
	// ePrivilege=5
	rpc WriteToAuditLogByID (.CContentModeration_WriteToAuditLogByID_Request) returns (.CContentModeration_WriteToAuditLogByID_Response);
}

