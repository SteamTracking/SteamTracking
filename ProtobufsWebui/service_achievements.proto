
message CAchievements_GetGameAchievements_Request {
	optional uint64 gameid = 1;
}

message CAchievements_GetGameAchievements_Response {
	repeated .CAchievements_GetGameAchievements_Response_Achievement achievements = 1;
	optional int32 schema_version = 2;
	repeated .CAchievements_GetGameAchievements_Response_Group groups = 3;
}

message CAchievements_GetGameAchievements_Response_Achievement {
	optional string internal_name = 1;
	optional string localized_name = 2;
	optional string localized_desc = 3;
	optional string icon = 4;
	optional string icon_gray = 5;
	optional bool hidden = 6;
	optional uint32 internal_key = 8;
	optional int32 min_progress_int = 9;
	optional int32 max_progress_int = 10;
	optional uint32 groupid = 11;
	optional bool archived = 12;
	optional float min_progress_float = 14;
	optional float max_progress_float = 15;
}

message CAchievements_GetGameAchievements_Response_Group {
	optional uint32 groupid = 1;
	optional string localized_name = 2;
	optional uint32 dlcappid = 3;
	optional bool archived = 4;
	optional bool developeronly = 5;
	optional uint32 order = 6;
	optional bool ispublic = 7;
}

message CAchievements_GetInfo_Request {
	optional uint64 gameid = 1;
}

message CAchievements_GetInfo_Response {
	repeated .CAchievements_GetInfo_Response_Info achievements = 1;
}

message CAchievements_GetInfo_Response_Info {
	optional string id = 1;
	optional string name = 2;
	optional string desc = 3;
	optional string image_url_achieved = 4;
	optional string image_url_not_achieved = 5;
	optional bool achieved = 6;
	optional uint32 unlock_time = 7;
}

message CAchievements_GetUserAchievements_Request {
	optional uint64 gameid = 1;
}

message CAchievements_GetUserAchievements_Response {
	repeated .CAchievements_GetUserAchievements_Response_Achievement achievements = 1;
	repeated .CAchievements_GetUserAchievements_Response_Group groups = 2;
	optional int32 schema_version = 3;
}

message CAchievements_GetUserAchievements_Response_Achievement {
	optional uint32 internal_key = 1;
	optional bool unlocked = 2;
	optional fixed32 unlock_time = 3;
	optional int32 progress_int = 4;
	optional float progress_float = 5;
}

message CAchievements_GetUserAchievements_Response_Group {
	optional uint32 groupid = 1;
	optional bool is_achievable = 2;
	optional uint32 completed_achievements = 3;
	optional bool is_completed = 4;
	optional fixed32 time_completed = 9;
}

service Achievements {
	// ePrivilege=1, eClientExecutionSite=2
	rpc GetGameAchievements (.CAchievements_GetGameAchievements_Request) returns (.CAchievements_GetGameAchievements_Response);
	// ePrivilege=1, eClientExecutionSite=2
	rpc GetInfo (.CAchievements_GetInfo_Request) returns (.CAchievements_GetInfo_Response);
	// ePrivilege=1, eClientExecutionSite=2
	rpc GetUserAchievements (.CAchievements_GetUserAchievements_Request) returns (.CAchievements_GetUserAchievements_Response);
}

